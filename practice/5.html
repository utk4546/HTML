<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkdin apply and save button</title>
    <style>
       .app{
        height: 38px;
            width: 200px;
            color: white;
            background-color: rgb(10,102,194);
            border: none;
            border-radius: 17px;
            margin-right: 7px
       }
       .sv{
        height: 38px;
            width: 80px;
            color: rgb(86, 86, 244);
            background-color: rgb(239, 236, 243);
            border-color: rgb(106, 129, 206);
            border-radius: 18px;
            margin-right: 7px
       }
    </style>
</head>
<body>
    <button  class="app"> Apply on company website</button>
    <button class="sv"> Save</button>
</body>
</html>
